
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | NEXORA</title>
    <link rel="stylesheet" href="css/estilos.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F6F1E9;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px #0000000d;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #1F5A5A;
            text-decoration: none;
        }

        .logo span {
            color: #D98E5B;
        }

        h2 {
            text-align: center;
            color: #1F5A5A;
            margin: 20px 0 8px;
        }

        .description {
            text-align: center;
            color: #82908D;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #294747;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #DFE5E1;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #1F5A5A;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1F5A5A;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-button:hover {
            background: #174747;
        }

        .message {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #74817F;
        }

        .login-link a {
            color: #1F5A5A;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #82908D;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="css/nexora.css">
    <link rel="icon" href="imagen/nexora-marca.svg" type="image/svg+xml">
    <script src="js/nexora-core.js"></script>
</head>

<body>

    <main class="register-container">

        <a href="index.html" class="logo">NEXORA<span>.</span></a>

        <h2>Crear una cuenta</h2>

        <p class="description">
            Únete a nuestra comunidad y comienza a crear nuevas oportunidades.
        </p>
        <p class="auth-privacy-note" role="note">
            Demo local: tu cuenta permanece en este navegador. No uses una contraseña que utilices en otros servicios.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre"
                    placeholder="Ingresa tu nombre completo"
                    required minlength="3">
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo"
                    placeholder="ejemplo@correo.com"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password"
                    placeholder="Mínimo 8 caracteres"
                    required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword"
                    placeholder="Repite tu contraseña"
                    required minlength="8">
            </div>

            <button type="submit" class="register-button">
                Crear cuenta
            </button>

            <p id="message" class="message"></p>

        </form>

        <p class="login-link">
            ¿Ya tienes una cuenta?
            <a href="login.html">Inicia sesión</a>
        </p>

        <a href="index.html" class="back-link">
            Volver al inicio
        </a>

    </main>

    
<script src="js/registro.js"></script>

</body>
</html>
