
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | NEXORA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>

:root {
    --verde: #1F5A5A;
    --terracota: #D98E5B;
    --crema: #F6F1E9;
    --oscuro: #263535;
    --blanco: #FFFFFF;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'DM Sans', Arial, sans-serif;
    background: var(--crema);
    color: var(--oscuro);
}

a {
    text-decoration: none;
}

.navbar {
    height: 82px;
    padding: 0 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--blanco);
}

.logo {
    color: var(--verde);
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: var(--terracota);
}

.nav-links {
    display: flex;
    gap: 32px;
}

.nav-links a {
    color: #4E5C5C;
    font-size: 14px;
    font-weight: 600;
}

.nav-links a:hover {
    color: var(--terracota);
}

.nav-buttons {
    display: flex;
    align-items: center;
    gap: 18px;
}

.btn-login {
    color: var(--verde);
    font-weight: 700;
    font-size: 14px;
}

.btn-register,
.btn-primary {
    background: var(--verde);
    color: white;
    padding: 13px 23px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    display: inline-block;
    transition: .3s;
}

.btn-register:hover,
.btn-primary:hover {
    background: #164343;
    transform: translateY(-2px);
}

.hero {
    min-height: 610px;
    padding: 80px 10%;
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    align-items: center;
    gap: 50px;
}

.tagline,
.section-label {
    color: #A8552A;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
}

.hero h1 {
    color: var(--verde);
    font-size: clamp(38px, 4.4vw, 59px);
    line-height: 1.13;
    margin: 22px 0;
    letter-spacing: -2px;
}

.hero h1 span {
    color: var(--terracota);
}

.hero-content > p {
    color: #687575;
    max-width: 540px;
    font-size: 16px;
    line-height: 1.9;
}

.hero-buttons {
    display: flex;
    gap: 15px;
    margin-top: 30px;
    align-items: center;
}

.btn-secondary {
    color: var(--verde);
    font-weight: 700;
    padding: 13px 20px;
}

.hero-stats {
    display: flex;
    gap: 50px;
    margin-top: 48px;
}

.hero-stats h3 {
    color: var(--verde);
    font-size: 16px;
}

.hero-stats p {
    color: #778080;
    font-size: 12px;
    margin-top: 6px;
}

.hero-visual {
    position: relative;
    padding: 25px;
}

.main-card {
    background: white;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px #1F5A5A18;
}

.card-top {
    display: flex;
    gap: 13px;
    align-items: center;
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--verde);
    color: white;
    font-weight: 800;
    font-size: 20px;
}

.card-top strong,
.card-top small {
    display: block;
}

.card-top strong {
    color: var(--verde);
}

.card-top small {
    color: #899191;
    margin-top: 4px;
    font-size: 12px;
}

.network-graphic {
    height: 260px;
    margin: 25px 0;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #F6F1E9;
    border-radius: 15px;
}

.network-center,
.network-node {
    position: absolute;
    display: grid;
    place-items: center;
    border-radius: 50%;
}

.network-center {
    width: 90px;
    height: 90px;
    background: var(--verde);
    color: white;
    font-size: 35px;
    font-weight: 800;
    border: 8px solid #DCE9E5;
    z-index: 2;
}

.network-node {
    width: 55px;
    height: 55px;
    background: white;
    box-shadow: 0 5px 20px #00000012;
    font-size: 24px;
}

.node-one { top: 25px; left: 55px; }
.node-two { top: 25px; right: 55px; }
.node-three { bottom: 25px; left: 55px; }
.node-four { bottom: 25px; right: 55px; }

.card-message strong {
    color: var(--verde);
}

.card-message p {
    color: #858D8D;
    margin-top: 5px;
    font-size: 13px;
}

.floating-card {
    position: absolute;
    right: -5px;
    bottom: -5px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: white;
    padding: 17px;
    border-radius: 12px;
    box-shadow: 0 10px 35px #00000012;
}

.floating-card > span {
    color: var(--terracota);
    font-size: 27px;
}

.floating-card strong,
.floating-card small {
    display: block;
}

.floating-card strong {
    color: var(--verde);
    font-size: 13px;
}

.floating-card small {
    color: #858D8D;
    font-size: 11px;
    margin-top: 4px;
}

.about {
    text-align: center;
    padding: 90px 20px;
    background: white;
}

.about h2,
.features h2 {
    color: var(--verde);
    font-size: 34px;
    margin: 18px 0;
}

.about p {
    max-width: 690px;
    margin: auto;
    line-height: 1.9;
    color: #687575;
}

.features {
    padding: 90px 10%;
    text-align: center;
}

.feature-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-top: 45px;
}

.feature-card {
    text-align: left;
    background: white;
    border-radius: 13px;
    padding: 28px;
    border: 1px solid #EAE5DC;
    transition: .3s;
}

.feature-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px #1F5A5A12;
}

.feature-icon {
    font-size: 30px;
    margin-bottom: 18px;
}

.feature-card h3 {
    color: var(--verde);
    margin-bottom: 12px;
}

.feature-card p {
    color: #758080;
    font-size: 14px;
    line-height: 1.8;
}

.cta {
    background: var(--verde);
    color: white;
    text-align: center;
    padding: 75px 20px;
}

.cta h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

.cta p {
    color: #E0EAE7;
    margin-bottom: 28px;
}

.cta .btn-primary {
    background: var(--terracota);
}

footer {
    background: white;
    text-align: center;
    padding: 35px 15px;
}

footer p {
    color: #778080;
    margin: 12px 0;
    font-size: 13px;
}

footer small {
    color: #929999;
    font-size: 11px;
}

@media (max-width: 900px) {
    .navbar {
        padding: 18px 5%;
        height: auto;
        flex-wrap: wrap;
        gap: 18px;
    }

    .nav-links {
        order: 3;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 18px;
    }

    .hero {
        grid-template-columns: 1fr;
        padding: 55px 7%;
    }

    .hero-visual {
        max-width: 550px;
        width: 100%;
        margin: auto;
    }

    .feature-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 550px) {
    .nav-buttons {
        gap: 10px;
    }

    .hero h1 {
        font-size: 38px;
    }

    .hero-stats {
        gap: 20px;
    }

    .feature-grid {
        grid-template-columns: 1fr;
    }

    .about h2,
    .features h2,
    .cta h2 {
        font-size: 27px;
    }

    .floating-card {
        right: 0;
    }
}

.auth-body {
    min-height: 100vh;
    background: var(--crema);
}

.auth-navbar {
    padding: 0 8%;
}

.back-home {
    color: var(--verde);
    font-size: 14px;
    font-weight: 700;
}

.auth-container {
    min-height: calc(100vh - 150px);
    padding: 65px 10%;
    display: grid;
    grid-template-columns: 1fr 0.85fr;
    align-items: center;
    gap: 75px;
}

.auth-info h1 {
    color: var(--verde);
    font-size: clamp(35px, 4vw, 52px);
    line-height: 1.15;
    margin: 22px 0;
    max-width: 550px;
}

.auth-info > p {
    color: #687575;
    line-height: 1.9;
    max-width: 500px;
    margin-bottom: 30px;
}

.auth-benefit {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: #526363;
    font-size: 14px;
}

.auth-benefit span {
    background: #DCE9E5;
    color: var(--verde);
    width: 27px;
    height: 27px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 800;
}

.auth-card {
    background: white;
    padding: 38px;
    border-radius: 18px;
    box-shadow: 0 15px 50px #1F5A5A12;
    width: 100%;
    max-width: 470px;
    justify-self: end;
}

.auth-heading {
    text-align: center;
    margin-bottom: 30px;
}

.auth-icon {
    width: 55px;
    height: 55px;
    background: var(--verde);
    color: white;
    border-radius: 15px;
    display: grid;
    place-items: center;
    font-size: 25px;
    font-weight: 800;
    margin: 0 auto 18px;
}

.auth-heading h2 {
    color: var(--verde);
    font-size: 27px;
    margin-bottom: 9px;
}

.auth-heading p {
    color: #899191;
    font-size: 14px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    color: #344646;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 9px;
}

.form-group input {
    width: 100%;
    height: 48px;
    border: 1px solid #DDE3DF;
    border-radius: 8px;
    padding: 0 14px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    background: #FCFCFA;
}

.form-group input:focus {

    box-shadow: 0 0 0 3px #1F5A5A14;
}

.password-wrapper {

.password-wrapper input {

}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: var(--verde);

}

.form-options {

.remember-label {

}

.form-options a {

    font-weight: 700;
}

.auth-submit {

    border-radius: 8px;
    background: var(--verde);

    font-size: 14px;

.auth-submit:hover {

.form-message {

.auth-divider {

    font-size: 13px;

.auth-footer {

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F6F1E9;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px #0000000d;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #1F5A5A;
            text-decoration: none;
        }

        .logo span {
            color: #D98E5B;
        }

        h2 {
            text-align: center;
            color: #1F5A5A;
            margin: 20px 0 8px;
        }

        .description {
            text-align: center;
            color: #82908D;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #294747;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #DFE5E1;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #1F5A5A;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1F5A5A;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-button:hover {
            background: #174747;
        }

        .message {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #74817F;
        }

        .login-link a {
            color: #1F5A5A;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #82908D;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="register-container">

        <a href="index.html" class="logo">NEXORA<span>.</span></a>

        <h2>Crear una cuenta</h2>

        <p class="description">
            Únete a nuestra comunidad y comienza a crear nuevas oportunidades.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre"
                    placeholder="Ingresa tu nombre completo"
                    required minlength="3">
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo"
                    placeholder="ejemplo@correo.com"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password"
                    placeholder="Mínimo 8 caracteres"
                    required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword"
                    placeholder="Repite tu contraseña"
                    required minlength="8">
            </div>

            <button type="submit" class="register-button">
                Crear cuenta
            </button>

            <p id="message" class="message"></p>

        </form>

        <p class="login-link">
            ¿Ya tienes una cuenta?
            <a href="login.html">Inicia sesión</a>
        </p>

        <a href="index.html" class="back-link">
            Volver al inicio
        </a>

    </main>

    
<script>
    document.addEventListener("DOMContentLoaded", function() {

        const registerForm = document.getElementById("registerForm");

        if (!registerForm) return;

        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const correo = document.getElementById("correo").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            message.style.color = "#C0392B";

            if (nombre.length < 3) {
                message.textContent = "Ingresa un nombre válido.";
                return;
            }

            if (password.length < 8) {
                message.textContent = "La contraseña debe tener al menos 8 caracteres.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Las contraseñas no coinciden.";
                return;
            }

            let usuarios = [];

            try {
                usuarios = JSON.parse(
                    localStorage.getItem("usuariosNexora") || "[]"
                );
            } catch (error) {
                message.textContent = "Error al recuperar los registros.";
                return;
            }

            const existe = usuarios.some(usuario =>
                usuario.correo &&
                usuario.correo.toLowerCase() === correo
            );

            if (existe) {
                message.textContent = "Este correo ya está registrado.";
                return;
            }

            const nuevoUsuario = {
                nombre: nombre,
                correo: correo,
                password: password,
                contrasena: password
            };

            usuarios.push(nuevoUsuario);

            localStorage.setItem(
                "usuariosNexora",
                JSON.stringify(usuarios)
            );

            message.style.color = "#1F7A50";
            message.textContent = "¡Cuenta creada correctamente!";

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1200);

        });

    });
</script>

</body>
