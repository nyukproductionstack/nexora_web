
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | NEXORA</title>
    <link rel="stylesheet" href="css/estilos.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F6F1E9;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px #0000000d;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #1F5A5A;
            text-decoration: none;
        }

        .logo span {
            color: #D98E5B;
        }

        h2 {
            text-align: center;
            color: #1F5A5A;
            margin: 20px 0 8px;
        }

        .description {
            text-align: center;
            color: #82908D;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #294747;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #DFE5E1;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #1F5A5A;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1F5A5A;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-button:hover {
            background: #174747;
        }

        .message {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #74817F;
        }

        .login-link a {
            color: #1F5A5A;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #82908D;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="register-container">

        <a href="index.html" class="logo">NEXORA<span>.</span></a>

        <h2>Crear una cuenta</h2>

        <p class="description">
            Únete a nuestra comunidad y comienza a crear nuevas oportunidades.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre"
                    placeholder="Ingresa tu nombre completo"
                    required minlength="3">
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo"
                    placeholder="ejemplo@correo.com"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password"
                    placeholder="Mínimo 8 caracteres"
                    required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword"
                    placeholder="Repite tu contraseña"
                    required minlength="8">
            </div>

            <button type="submit" class="register-button">
                Crear cuenta
            </button>

            <p id="message" class="message"></p>

        </form>

        <p class="login-link">
            ¿Ya tienes una cuenta?
            <a href="login.html">Inicia sesión</a>
        </p>

        <a href="index.html" class="back-link">
            Volver al inicio
        </a>

    </main>

    
<script>
    document.addEventListener("DOMContentLoaded", function() {

        const registerForm = document.getElementById("registerForm");

        if (!registerForm) return;

        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const correo = document.getElementById("correo").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            message.style.color = "#C0392B";

            if (nombre.length < 3) {
                message.textContent = "Ingresa un nombre válido.";
                return;
            }

            if (password.length < 8) {
                message.textContent = "La contraseña debe tener al menos 8 caracteres.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Las contraseñas no coinciden.";
                return;
            }

            let usuarios = [];

            try {
                usuarios = JSON.parse(
                    localStorage.getItem("usuariosNexora") || "[]"
                );
            } catch (error) {
                message.textContent = "Error al recuperar los registros.";
                return;
            }

            const existe = usuarios.some(usuario =>
                usuario.correo &&
                usuario.correo.toLowerCase() === correo
            );

            if (existe) {
                message.textContent = "Este correo ya está registrado.";
                return;
            }

            const nuevoUsuario = {
                nombre: nombre,
                correo: correo,
                password: password,
                contrasena: password
            };

            usuarios.push(nuevoUsuario);

            localStorage.setItem(
                "usuariosNexora",
                JSON.stringify(usuarios)
            );

            message.style.color = "#1F7A50";
            message.textContent = "¡Cuenta creada correctamente!";

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1200);

        });

    });
</script>

</body>
</html>
